<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffb6d1">
  <title>برای خواهرگلم ❤️</title>
  <style>
    :root { --pink: #ff5c9a; --deep: #c2185b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      color: #7b1647;
      background: linear-gradient(135deg, #ffe4ef, #ffc2da 45%, #fff0f6);
      min-height: 100svh;
      overflow-x: hidden;
    }
    .screen {
      min-height: 100svh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px 16px; position: relative; isolation: isolate;
    }
    .name { position: absolute; top: max(22px, env(safe-area-inset-top)); font-size: clamp(1.35rem, 5vw, 2rem); font-weight: 800; }
    .card {
      width: min(100%, 520px); padding: 34px 20px; border-radius: 28px;
      background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 18px 55px rgba(194,24,91,.14); backdrop-filter: blur(8px);
    }
    h1 { font-size: clamp(1.6rem, 6vw, 2.4rem); line-height: 1.65; margin: 0 0 26px; }
    .buttons { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; }
    button {
      border: 0; border-radius: 999px; padding: 14px 20px; min-height: 52px;
      font: inherit; font-weight: 800; cursor: pointer; touch-action: manipulation;
      box-shadow: 0 8px 20px rgba(123,22,71,.15); transition: transform .25s, box-shadow .25s;
    }
    button:active { filter: brightness(.97); }
    #yes { color: white; background: linear-gradient(135deg, #ff4f91, #e91e63); transform: scale(var(--yes-scale, 1)); transform-origin: center; z-index: 2; }
    #no { color: #a31550; background: white; }
    .hint { margin: 24px 0 0; font-size: .95rem; }
    .final { display: none; position: fixed; inset: 0; z-index: 10; overflow: hidden;
      background: radial-gradient(circle at top, #fff0f6, #ffb6d1 55%, #ff8fba);
      align-items: center; justify-content: center; padding: 24px 18px; }
    .final.show { display: flex; animation: fadeIn .7s ease both; }
    .final-inner { position: relative; z-index: 2; text-align: center; width: min(100%, 900px); }
    .final h2 { margin: 0 auto 22px; color: #a10f50; font-size: clamp(2rem, 8.2vw, 4.8rem); line-height: 1.65; text-shadow: 0 4px 0 rgba(255,255,255,.6); }
    .big-heart { display: inline-block; font-size: clamp(5rem, 24vw, 11rem); line-height: 1.25; animation: heartbeat 1.1s infinite; filter: drop-shadow(0 12px 18px rgba(194,24,91,.22)); }
    .floating-heart { position: fixed; bottom: -50px; pointer-events: none; z-index: 1; opacity: .7; animation: floatUp linear forwards; }
    .sparkle { position: absolute; color: white; opacity: .7; animation: twinkle 2s ease-in-out infinite alternate; }
    @keyframes heartbeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.16); } 30% { transform: scale(.98); } 45% { transform: scale(1.12); } 60% { transform: scale(1); } }
    @keyframes floatUp { to { transform: translateY(-115svh) rotate(25deg); opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes twinkle { from { transform: scale(.7) rotate(0); opacity: .3; } to { transform: scale(1.2) rotate(20deg); opacity: .9; } }
    @media (max-width: 380px) { .card { padding: 28px 14px; } button { padding: 12px 15px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="screen" id="questionScreen">
    <div class="name">ضیا ❤️</div>
    <section class="card" aria-labelledby="question">
      <h1 id="question">یه سؤال ازت دارم… 🥹❤️</h1>
      <div class="buttons">
        <button id="yes" type="button">❤️ آره، دوستت دارم</button>
        <button id="no" type="button">💔 نه، دوستت ندارم</button>
      </div>
      <p class="hint">یه جواب از ته دل بده 💗</p>
    </section>
  </main>

  <section class="final" id="finalScreen" aria-live="polite">
    <span class="sparkle" style="top:12%;left:12%;font-size:2rem">✦</span>
    <span class="sparkle" style="top:22%;right:13%;font-size:1.6rem;animation-delay:.6s">✧</span>
    <span class="sparkle" style="bottom:17%;left:18%;font-size:2.2rem;animation-delay:1s">✦</span>
    <div class="final-inner">
      <h2>💖 من بیشتر دوستت دارم خواهرگلم ❤️</h2>
      <div class="big-heart" aria-label="قلب تپنده">❤️</div>
    </div>
  </section>

  <script>
    const yesButton = document.getElementById('yes');
    const noButton = document.getElementById('no');
    const questionScreen = document.getElementById('questionScreen');
    const finalScreen = document.getElementById('finalScreen');
    let noClicks = 0;
    let heartTimer;

    noButton.addEventListener('click', () => {
      noClicks++;
      // هر بار بزرگ‌تر می‌شود، ولی اندازه روی گوشی از حد صفحه فراتر نمی‌رود.
      const scale = Math.min(1 + noClicks * 0.22, 2.8);
      yesButton.style.setProperty('--yes-scale', scale);
      yesButton.style.boxShadow = `0 10px ${18 + noClicks * 3}px rgba(194,24,91,.25)`;
      noButton.textContent = noClicks < 3 ? '💔 مطمئنی؟' : noClicks < 6 ? '🥹 یه بار دیگه فکر کن!' : '💗 شاید آره؟';
      createHeart();
    });

    yesButton.addEventListener('click', () => {
      questionScreen.style.display = 'none';
      finalScreen.classList.add('show');
      for (let i = 0; i < 18; i++) setTimeout(createHeart, i * 120);
      heartTimer = setInterval(createHeart, 430);
    });

    function createHeart() {
      // برای جلوگیری از شلوغی، تعداد قلب‌های شناور محدود است.
      if (document.querySelectorAll('.floating-heart').length > 35) return;
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = ['💗', '💖', '💕', '❤️', '💘'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (16 + Math.random() * 24) + 'px';
      heart.style.animationDuration = (4 + Math.random() * 5) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9500);
    }

    // قلب‌های آرام پس‌زمینه از همان ابتدای صفحه
    setInterval(() => {
      if (!finalScreen.classList.contains('show')) createHeart();
    }, 900);
  </script>
</body>
</html>
