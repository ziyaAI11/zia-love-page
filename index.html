<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffb6d1">
<title>ضیا ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #ffe0ec, #fff5f8, #ffc5dc);
  color: #8b2850;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

.card {
  width: 90%;
  max-width: 440px;
  padding: 30px 20px;
  text-align: center;
  background: #ffffffdf;
  border-radius: 28px;
  box-shadow: 0 10px 40px #e7548030;
}

.top-heart {
  font-size: 55px;
  animation: beat 1s infinite;
}

h1 {
  font-size: 30px;
}

p {
  font-size: 19px;
}

.buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  margin-top: 28px;
}

button {
  border: none;
  border-radius: 18px;
  padding: 15px 22px;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.25s ease;
}

#yes {
  background: #ff4081;
  color: white;
  box-shadow: 0 6px 18px #ff408155;
  position: relative;
  z-index: 2;
}

#no {
  background: #eee5e9;
  color: #754052;
}

#message {
  margin-top: 25px;
  font-weight: bold;
  min-height: 25px;
}

.signature {
  margin-top: 25px;
  font-size: 14px;
  color: #b46b88;
}

#loveScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: linear-gradient(135deg, #ffe0ec, #fff5f8, #ffc1d9);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
  overflow: hidden;
}

#loveScreen.show {
  display: flex;
  animation: appear 0.6s ease;
}

.love-text {
  font-size: clamp(35px, 9vw, 65px);
  font-weight: 900;
  line-height: 1.7;
  color: #e91e63;
  text-shadow: 0 5px 20px #ff69a455;
}

.big-heart {
  font-size: clamp(120px, 35vw, 220px);
  line-height: 1.4;
  animation: beat 0.85s infinite;
  filter: drop-shadow(0 10px 20px #ff408155);
}

.love-signature {
  font-size: 25px;
  font-weight: bold;
  margin-top: 10px;
  color: #ad2457;
}

#back {
  margin-top: 25px;
  padding: 12px 20px;
  background: white;
  color: #ad2457;
  font-size: 14px;
}

.floating {
  position: fixed;
  bottom: -50px;
  z-index: 15;
  pointer-events: none;
  animation: floatUp 4s linear forwards;
}

@keyframes beat {
  50% {
    transform: scale(1.15);
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes floatUp {
  to {
    transform: translateY(-120vh) rotate(25deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<main class="card">
  <div class="top-heart">💌</div>

  <h1>یه سؤال ازت دارم…</h1>
  <p>منو دوست داری؟ 🥹❤️</p>

  <div class="buttons">
    <button id="yes">آره، دوستت دارم ❤️</button>
    <button id="no">نه، دوستت ندارم 💔</button>
  </div>

  <div id="message"></div>

  <div class="signature">
    ساخته‌شده با عشق توسط ضیا ✨
  </div>
</main>

<section id="loveScreen">
  <div class="love-text">من بیشتر دوستت دارم خوهر گلم ❤️</div>

  <div class="big-heart">❤️</div>

  <div class="love-signature">با عشق، ضیا ❤️</div>

  <button id="back">برگشت به سؤال ↩️</button>
</section>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const message = document.getElementById("message");
const loveScreen = document.getElementById("loveScreen");
const back = document.getElementById("back");

let clicks = 0;
let heartTimer;

no.addEventListener("click", function() {
  clicks++;

  const scale = Math.min(1 + clicks * 0.15, 2.5);

  yes.style.transform = `scale(${scale})`;
  yes.style.fontSize = Math.min(17 + clicks, 28) + "px";

  const texts = [
    "مطمئنی؟ 🥺❤️",
    "یه بار دیگه فکر کن! 😭",
    "دکمه آره داره بزرگ می‌شه! 😂",
    "شاید آره رو امتحان کنی؟ 💗"
  ];

  message.textContent = texts[
    Math.min(clicks - 1, texts.length - 1)
  ];
});

function showHearts() {
  let count = 0;

  clearInterval(heartTimer);

  heartTimer = setInterval(function() {
    for (let i = 0; i < 3; i++) {
      const heart = document.createElement("span");

      heart.className = "floating";
      heart.textContent = ["❤️", "💖", "💕", "💗", "✨"][
        Math.floor(Math.random() * 5)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 25 + Math.random() * 25 + "px";
      heart.style.animationDuration = 3 + Math.random() * 2 + "s";

      document.body.appendChild(heart);

      setTimeout(function() {
        heart.remove();
      }, 5500);
    }

    count++;

    if (count >= 12) {
      clearInterval(heartTimer);
    }
  }, 250);
}

yes.addEventListener("click", function() {
  loveScreen.classList.add("show");
  showHearts();
});

back.addEventListener("click", function() {
  loveScreen.classList.remove("show");

  clearInterval(heartTimer);

  document.querySelectorAll(".floating").forEach(function(heart) {
    heart.remove();
  });
});
</script>

</body>
</html>
